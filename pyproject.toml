[project]
name = "thurbox-loop"
version = "0.2.1"
description = "Distinct debate and adversarial implementation workflows for Thurbox"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thurbox-loop = "thurbox_loop.cli:main"

[tool.setuptools.packages.find]
include = ["thurbox_loop*"]
